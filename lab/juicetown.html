<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>juicebox — juicetown</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  html,body{ margin:0; height:100%; overflow:hidden; background:#bfe3e6;
    font-family:"Fredoka",system-ui,sans-serif; color:#241d16; touch-action:none; }
  canvas{ display:block; }
  .brand{ position:fixed; top:14px; left:16px; z-index:5; font-weight:700; font-size:18px; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.25); } .brand b{ color:#ffd23f; }
  .hint{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:5;
    font-family:"Space Mono",monospace; font-size:12px; letter-spacing:.08em; color:#fff;
    background:rgba(0,0,0,.22); padding:7px 13px; border-radius:18px; text-shadow:0 1px 2px rgba(0,0,0,.3); }
  .enter{ position:fixed; left:50%; bottom:30%; transform:translate(-50%,0); z-index:7;
    background:#e0552e; color:#fff; font-weight:600; font-size:17px; padding:13px 22px; border-radius:14px;
    box-shadow:0 10px 24px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    text-decoration:none; }
  .enter.on{ opacity:1; transform:translate(-50%,-8px); pointer-events:auto; }
  /* touch controls */
  .pad{ position:fixed; z-index:6; bottom:24px; display:flex; gap:14px; }
  .padL{ left:24px; } .padR{ right:24px; }
  .btn{ width:64px; height:64px; border-radius:50%; border:0; background:rgba(255,255,255,.72);
    box-shadow:0 6px 14px rgba(0,0,0,.18); font-size:26px; color:#241d16; user-select:none; touch-action:none; }
  .btn:active{ background:#ffd23f; }
  @media(hover:hover) and (pointer:fine){ .pad{ display:none; } }
</style>
</head>
<body>
  <div class="brand">juice<b>town</b></div>
  <div class="hint" id="hint">drive with ← ↑ → (or W A D) · roll up to a sign</div>
  <a class="enter" id="enter" href="#">enter →</a>

  <div class="pad padL"><button class="btn" id="bL">◀</button><button class="btn" id="bR">▶</button></div>
  <div class="pad padR"><button class="btn" id="bF">▲</button></div>

<script type="module">
  import * as THREE from "https://esm.sh/three@0.160.0";

  const PROJECTS = [
    { name:'Whereabouts', url:'/where/', color:0x3f7d5a, live:true,  pos:[0,-14] },
    { name:'Coming soon', url:'',        color:0xe0552e, live:false, pos:[16,4] },
    { name:'Coming soon', url:'',        color:0x4a6ea8, live:false, pos:[-16,4] },
  ];

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3e6);
  scene.fog = new THREE.Fog(0xbfe3e6, 30, 70);
  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa66, 0.9));
  const sun = new THREE.DirectionalLight(0xfff2d0, 1.1); sun.position.set(10,18,6); scene.add(sun);

  const M = (c,r=0.85)=> new THREE.MeshStandardMaterial({ color:c, roughness:r, flatShading:true });

  // island
  const ground = new THREE.Mesh(new THREE.CylinderGeometry(40,42,2,40), M(0x9ed46a)); ground.position.y=-1; scene.add(ground);
  const beach = new THREE.Mesh(new THREE.CylinderGeometry(43,44,1.6,40), M(0xead9a3)); beach.position.y=-1.2; scene.add(beach);
  // path ring
  const path = new THREE.Mesh(new THREE.TorusGeometry(18,2.4,8,40), M(0xcfa46b)); path.rotation.x=Math.PI/2; path.position.y=0.02; scene.add(path);

  // scattered decor
  for(let i=0;i<26;i++){ const a=Math.random()*7, r=24+Math.random()*12;
    const tree = new THREE.Group(); const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,1.6,6),M(0x7a4f33));
    trunk.position.y=0.8; const top=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,0),M(0x5fae54)); top.position.y=2.2;
    tree.add(trunk,top); tree.position.set(Math.cos(a)*r,0,Math.sin(a)*r); tree.scale.setScalar(0.8+Math.random()*0.6); scene.add(tree); }
  for(let i=0;i<8;i++){ const b=new THREE.Mesh(new THREE.BoxGeometry(3+Math.random()*2,3+Math.random()*4,3),
    M([0xe7b0a0,0xa0c8e7,0xf0d98a,0xc8a0e7][i%4])); const a=Math.random()*7,r=6+Math.random()*8;
    b.position.set(Math.cos(a)*r, b.geometry.parameters.height/2-0.9, Math.sin(a)*r); scene.add(b); }

  // project signs (billboards)
  const signs = [];
  PROJECTS.forEach(p=>{
    const g = new THREE.Group(); g.position.set(p.pos[0],0,p.pos[1]);
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,3,8),M(0x6a4329)); post.position.y=1.5; g.add(post);
    const cv=document.createElement('canvas'); cv.width=256; cv.height=160; const cx=cv.getContext('2d');
    cx.fillStyle='#'+p.color.toString(16).padStart(6,'0'); cx.fillRect(0,0,256,160);
    cx.fillStyle='#fff'; cx.font='bold 30px Fredoka, sans-serif'; cx.textAlign='center'; cx.fillText(p.name,128,84);
    cx.font='16px "Space Mono",monospace'; cx.fillStyle='rgba(255,255,255,.85)'; cx.fillText(p.live?'▶ drive up to enter':'coming soon',128,118);
    const board=new THREE.Mesh(new THREE.PlaneGeometry(4,2.5), new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(cv),roughness:0.7}));
    board.position.y=3.4; g.add(board); const board2=board.clone(); board2.rotation.y=Math.PI; g.add(board2);
    scene.add(g); signs.push({...p, group:g});
  });

  // the car: a juicebox on wheels
  const car = new THREE.Group(); scene.add(car);
  const cbody=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.6,2.2),M(0xe0552e,0.6)); cbody.position.y=1.0; car.add(cbody);
  const fold=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.3,1.6),M(0xc0421f)); fold.position.y=1.95; car.add(fold);
  const straw=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1.4,8),M(0xffffff)); straw.position.set(0.4,2.5,0.3); straw.rotation.z=0.3; car.add(straw);
  // label
  const lc=document.createElement('canvas'); lc.width=128;lc.height=128; const lx=lc.getContext('2d');
  lx.fillStyle='#fbf7ee'; lx.fillRect(20,40,88,48); lx.fillStyle='#241d16'; lx.font='bold 20px Fredoka'; lx.textAlign='center'; lx.fillText('juice',64,70);
  const label=new THREE.Mesh(new THREE.PlaneGeometry(1.0,1.0), new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(lc),transparent:true}));
  label.position.set(0,1.0,1.11); car.add(label);
  [[-0.8,-0.7],[0.8,-0.7],[-0.8,0.7],[0.8,0.7]].forEach(([x,z])=>{ const w=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.3,12),M(0x222));
    w.rotation.z=Math.PI/2; w.position.set(x,0.4,z); car.add(w); });

  // driving state
  let px=0, pz=8, heading=Math.PI, speed=0;
  const keys={}; addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(e.key==='Enter') tryEnter(); });
  addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  // touch
  const t={L:false,R:false,F:false};
  const bind=(id,k)=>{ const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();t[k]=true;});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>t[k]=false)); };
  bind('bL','L'); bind('bR','R'); bind('bF','F');

  const enterEl=document.getElementById('enter'); let near=null;
  function tryEnter(){ if(near && near.live) location.href=near.url; }
  enterEl.addEventListener('click',e=>{ if(!near||!near.live){e.preventDefault();} });

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  let last=performance.now();
  function loop(now){ const dt=Math.min((now-last)/1000,0.05); last=now;
    const accel = (keys['arrowup']||keys['w']||t.F)?1:0;
    const turn = ((keys['arrowleft']||keys['a']||t.L)?1:0) - ((keys['arrowright']||keys['d']||t.R)?1:0);
    const brake = (keys['arrowdown']||keys['s'])?1:0;
    speed += accel*14*dt - brake*16*dt; speed *= 0.96; speed=Math.max(-6,Math.min(13,speed));
    heading += turn * dt * 1.8 * Math.min(1, Math.abs(speed)/3) * Math.sign(speed||1);
    px += Math.sin(heading)*speed*dt; pz += Math.cos(heading)*speed*dt;
    const R=Math.hypot(px,pz); if(R>38){ px=px/R*38; pz=pz/R*38; speed*=0.4; } // island edge
    car.position.set(px,0,pz); car.rotation.y = heading;
    straw.rotation.z = 0.3 + Math.sin(now*0.005)*0.05*Math.abs(speed);

    // camera follow
    const camPos = new THREE.Vector3(px - Math.sin(heading)*9, 5.5, pz - Math.cos(heading)*9);
    camera.position.lerp(camPos, 0.08); camera.lookAt(px, 1.2, pz);

    // proximity to signs
    near=null; let best=7;
    signs.forEach(s=>{ const d=Math.hypot(px-s.pos[0], pz-s.pos[1]); if(d<best){ best=d; near=s; } });
    if(near){ enterEl.classList.add('on'); enterEl.textContent = near.live? `enter ${near.name} →` : `${near.name} · soon`;
      if(near.live) enterEl.href=near.url; else enterEl.removeAttribute('href'); }
    else enterEl.classList.remove('on');

    renderer.render(scene,camera); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
