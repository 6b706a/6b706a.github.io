<!doctype html>

<style>
  html,body{ margin:0; height:100%; overflow:hidden; background:#0f1218;
    font-family:"Fredoka",system-ui,sans-serif; color:#eef2f7; cursor:grab; }

  canvas{ display:block; }
  .brand{ position:fixed; top:16px; left:18px; z-index:5; font-weight:700; font-size:18px; }
  .brand b{ color:#e0552e; }
  .hint{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:5;
    font-family:"Space Mono",monospace; font-size:12px; color:rgba(238,242,247,.7);
    background:rgba(0,0,0,.3); padding:8px 14px; border-radius:20px; pointer-events:none;
    transition:opacity .5s; text-align:center; }

  .panel button{ font:inherit; cursor:pointer; background:#222833; color:#eef2f7; border:1px solid rgba(238,242,247,.2); border-radius:10px; padding:9px 12px; font-size:13px; }
</style>
</head>
<body>
  <div class="hint" id="hint">drag to look around the room &middot; click a disc to load it</div>
  <div class="tip" id="tip"></div>
  <!-- the laptop screen is the UI: click a disc to load, click the screen to play -->

<script type="module">
  import * as THREE from "https://esm.sh/three@0.160.0";
  import { RoundedBoxGeometry } from "https://esm.sh/three@0.160.0/examples/jsm/geometries/RoundedBoxGeometry.js";

  const PROJECTS = [
    { name:'Whereabouts', tag:'daily geo game', url:'/where/', color:'#3f7d5a', live:true },
    { name:'Untitled 2',  tag:'coming soon',     url:'',        color:'#4a6ea8', live:false },
  ];

  // ===== room dimensions (smaller room, L-shaped) =====
  const RX=3, WX=-2.2, NZ=-3.8, SZ=2.7, STEPZ=2.2, STEPX=-0.8, RH=2.9, T=0.18;  // small L-indent in the SW corner

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x10131a);
  scene.fog = new THREE.Fog(0x10131a, 9, 22);
  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
  camera.rotation.order = 'YXZ';
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  const M = (c,rough=0.92) => new THREE.MeshStandardMaterial({ color:c, roughness:rough, flatShading:true });
  const box = (w,h,d,c,r=0.92) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M(c,r));
  function add(mesh,x,y,z,ry=0){ mesh.position.set(x,y,z); mesh.rotation.y=ry; scene.add(mesh); return mesh; }
  function roundedShape(w,h,r){ const s=new THREE.Shape(), hw=w/2, hh=h/2;   // rounded-rectangle (only the 4 corners)
    s.moveTo(-hw+r,-hh); s.lineTo(hw-r,-hh); s.quadraticCurveTo(hw,-hh,hw,-hh+r);
    s.lineTo(hw,hh-r); s.quadraticCurveTo(hw,hh,hw-r,hh); s.lineTo(-hw+r,hh);
    s.quadraticCurveTo(-hw,hh,-hw,hh-r); s.lineTo(-hw,-hh+r); s.quadraticCurveTo(-hw,-hh,-hw+r,-hh); return s; }

  const WALL=0xeee9d6, WOOD=0xb07a4a, WHITE=0xf4f1ea;
  // floor (L) + ceiling (white)
  add(box(RX-WX,T,STEPZ-NZ,WOOD), (WX+RX)/2,-0.09,(NZ+STEPZ)/2);
  add(box(RX-STEPX,T,SZ-STEPZ,WOOD), (STEPX+RX)/2,-0.09,(STEPZ+SZ)/2);
  add(box(RX-WX,T,STEPZ-NZ,WHITE), (WX+RX)/2,RH,(NZ+STEPZ)/2);
  add(box(RX-STEPX,T,SZ-STEPZ,WHITE), (STEPX+RX)/2,RH,(STEPZ+SZ)/2);
  // walls (red)
  add(box(RX-WX,RH,T,WALL), (WX+RX)/2,RH/2,NZ);             // back / north
  add(box(SZ-NZ,RH,T,WALL), RX,RH/2,(NZ+SZ)/2, Math.PI/2);   // east / right
  add(box(RX-STEPX,RH,T,WALL), (STEPX+RX)/2,RH/2,SZ);        // south
  add(box(SZ-STEPZ,RH,T,WALL), STEPX-T/2,RH/2,(STEPZ+SZ)/2, Math.PI/2); // inner wall (face flush at x=STEPX, thickness into void)
  add(box(STEPX-WX,RH,T,WALL), (WX+STEPX)/2,RH/2,STEPZ+T/2);          // step wall (face flush at z=STEPZ, thickness into void)
  add(box(STEPZ-NZ,RH,T,WALL), WX,RH/2,(NZ+STEPZ)/2, Math.PI/2);   // west / left
  // white baseboard trim
  const tb=(w,x,z,ry=0)=> add(box(w,0.16,0.06,WHITE,0.6), x,0.08,z,ry);
  tb(RX-WX,(WX+RX)/2,NZ+0.11); tb(SZ-NZ,RX-0.11,(NZ+SZ)/2,Math.PI/2);
  tb(0.7,-0.45,SZ-0.11); tb(0.5,2.75,SZ-0.11);   // south baseboard split around the closet
  tb(SZ-STEPZ,STEPX+0.02,(STEPZ+SZ)/2,Math.PI/2); tb(1.45,-1.475,STEPZ-0.02);   // step trim extended past corner to meet inner trim
  tb(4.55,-2.09,-1.525,Math.PI/2); tb(0.2,-2.09,2.1,Math.PI/2);   // west baseboard: up to the door, + stub south of it to the step wall

  // carpet (big, reaches the top-right corner)
  add(box(3.95,0.04,5.4,0xcfc7b6), 0.775,0.02,-0.75);

  // ===== BED (NE, head on north wall, LONG, blue) =====
  const bedFrame=new THREE.Mesh(new RoundedBoxGeometry(2.1,0.45,2.6,3,0.06), new THREE.MeshStandardMaterial({color:0x7a5236,roughness:0.9})); bedFrame.position.set(1.5,0.225,-2.4); scene.add(bedFrame);   // rounded frame (shorter south)
  const mattress=new THREE.Mesh(new RoundedBoxGeometry(2.0,0.27,2.45,3,0.06), new THREE.MeshStandardMaterial({color:0xefe7d6,roughness:0.95})); mattress.position.set(1.5,0.55,-2.345); scene.add(mattress);   // rounded mattress
  const dvc=document.createElement('canvas'); dvc.width=16; dvc.height=96; const dvx=dvc.getContext('2d');
  ['#243f63','#3a6ea8','#e7e0cb'].forEach((c,k)=>{ dvx.fillStyle=c; dvx.fillRect(0,k*32,16,32); });   // darker blue / blue / beige
  const dvTex=new THREE.CanvasTexture(dvc); dvTex.wrapS=dvTex.wrapT=THREE.RepeatWrapping; dvTex.repeat.set(1,1);
  const dvSolid=new THREE.MeshStandardMaterial({color:0xe7e0cb,roughness:0.9});
  const comfGeo=new RoundedBoxGeometry(2.06,0.24,2.2,4,0.05);
  { const pos=comfGeo.attributes.position, uv=comfGeo.attributes.uv;
    for(let i=0;i<pos.count;i++) uv.setXY(i,(pos.getX(i)+1.03)/2.06,(pos.getZ(i)+1.1)/2.2); uv.needsUpdate=true; }   // stripes follow length (z) -> wrap continuously over the edges
  const duvet=new THREE.Mesh(comfGeo, new THREE.MeshStandardMaterial({map:dvTex,roughness:0.9})); duvet.position.set(1.5,0.59,-2.12); scene.add(duvet);   // rounded striped comforter
  function pillowGeo(w,d){ const r=0.05, hw=w/2-0.07, hd=d/2-0.07, s=new THREE.Shape();   // rounded-rectangle footprint
    s.moveTo(-hw+r,-hd); s.lineTo(hw-r,-hd); s.quadraticCurveTo(hw,-hd,hw,-hd+r);
    s.lineTo(hw,hd-r); s.quadraticCurveTo(hw,hd,hw-r,hd); s.lineTo(-hw+r,hd);
    s.quadraticCurveTo(-hw,hd,-hw,hd-r); s.lineTo(-hw,-hd+r); s.quadraticCurveTo(-hw,-hd,-hw+r,-hd);
    const g=new THREE.ExtrudeGeometry(s,{depth:0.015,bevelEnabled:true,bevelThickness:0.045,bevelSize:0.07,bevelSegments:5,curveSegments:10});
    g.rotateX(-Math.PI/2); g.center(); return g; }   // bevel -> puffy, fully rounded edges
  const pilMat=new THREE.MeshStandardMaterial({color:0xece7db,roughness:1});
  [[1.0,-0.04],[2.0,0.05]].forEach(([px,ry])=>{ const pil=new THREE.Mesh(pillowGeo(0.8,0.5), pilMat); pil.position.set(px,0.83,-3.25); pil.rotation.set(0.4,ry,0); scene.add(pil); });  // pillows propped against the north wall
  { const pil=new THREE.Mesh(pillowGeo(0.8,0.5), pilMat); pil.position.set(1.3,0.84,-2.85); pil.rotation.set(0.38,0.1,0); scene.add(pil); }   // third pillow resting on the other two, tilted up

  // ===== DESK (long white fold-up table, at BED HEIGHT) =====
  const deskTopY=0.65;
  { const dw=2.4, dd=0.6, dr=0.05, dh=0.05, sh=new THREE.Shape(), hw=dw/2, hd=dd/2;   // white top, ONLY the 4 corners rounded
    sh.moveTo(-hw+dr,-hd); sh.lineTo(hw-dr,-hd); sh.quadraticCurveTo(hw,-hd,hw,-hd+dr);
    sh.lineTo(hw,hd-dr); sh.quadraticCurveTo(hw,hd,hw-dr,hd); sh.lineTo(-hw+dr,hd);
    sh.quadraticCurveTo(-hw,hd,-hw,hd-dr); sh.lineTo(-hw,-hd+dr); sh.quadraticCurveTo(-hw,-hd,-hw+dr,-hd);
    const deskTop=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:dh,bevelEnabled:false}), M(0xf2efe8,0.6));
    deskTop.rotation.x=-Math.PI/2; deskTop.position.set(1.3,deskTopY-dh/2,-0.5); scene.add(deskTop); }
  [[-1.1,-0.22],[1.1,-0.22],[-1.1,0.22],[1.1,0.22]].forEach(([dx,dz])=>{ const lg=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,deskTopY,12),M(0x8a8d90,0.4)); lg.position.set(1.3+dx,deskTopY/2,-0.5+dz); scene.add(lg); }); // skinny grey cylinder legs

  // ===== LAPTOP on the desk, screen facing you =====
  const tv=new THREE.Group(); tv.position.set(1.55,deskTopY+0.05,-0.55); scene.add(tv);
  const lapMat=M(0x30343a,0.4);
  const base=new THREE.Mesh(new THREE.ExtrudeGeometry(roundedShape(0.52,0.36,0.03),{depth:0.01,bevelEnabled:false}),lapMat); base.rotation.x=-Math.PI/2; base.position.set(0,-0.005,0.06); tv.add(base);
  const kb=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.006,0.2),M(0x1b1d21,0.6)); kb.position.set(0,0.008,0.02); tv.add(kb);
  const trackpad=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.003,0.08),M(0x2a2d33,0.5)); trackpad.position.set(0,0.0068,0.19); tv.add(trackpad);  // thin pad on the deck
  const lid=new THREE.Group(); lid.position.set(0,0.005,-0.12); lid.rotation.x=-0.34; tv.add(lid);  // hinge at thinner base top
  const lidPanel=new THREE.Mesh(new THREE.ExtrudeGeometry(roundedShape(0.52,0.36,0.03),{depth:0.012,bevelEnabled:false}),lapMat); lidPanel.position.set(0,0.18,-0.006); lid.add(lidPanel);
  const sc=document.createElement('canvas'); sc.width=512; sc.height=384; const sctx=sc.getContext('2d');
  const screenTex=new THREE.CanvasTexture(sc);
  const screen=new THREE.Mesh(new THREE.PlaneGeometry(0.46,0.3),
    new THREE.MeshStandardMaterial({ map:screenTex, emissive:0xffffff, emissiveMap:screenTex, emissiveIntensity:0.45, roughness:1 }));
  screen.position.set(0,0.18,0.012); lid.add(screen);
  // long mousepad, mouse, and USB cable wrapped around the back of the laptop
  add(box(1.25,0.008,0.36,0x2a2c30,0.85), 1.725,deskTopY+0.03,-0.45);                // long grey/black mousepad
  const mouse=new THREE.Group(); mouse.position.set(2.07,deskTopY+0.03,-0.43);                  // mouse
  const mg=new THREE.SphereGeometry(1,30,22); { const p=mg.attributes.position, v=new THREE.Vector3();
    for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const uy=v.y;
      v.x*=0.044; v.z*=0.072; v.y*=0.037; if(uy>0) v.x*=1.18;              // proportions + wider top
      if(v.z<0) v.x*=1-0.4*(-v.z/0.072);                                   // taper toward the front
      if(uy<0){ const r=Math.min(1,Math.hypot(v.x/0.044,v.z/0.072)); v.y=v.y*0.45+(1-r)*0.015; }  // arched (U) bottom
      p.setXYZ(i,v.x,v.y,v.z); } mg.computeVertexNormals(); }
  const mbody=new THREE.Mesh(mg, new THREE.MeshStandardMaterial({color:0x24272d,roughness:0.35})); mbody.position.y=0.017; mouse.add(mbody);
  const mwheel=new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.004,0.009,12), M(0x70747a,0.4)); mwheel.rotation.z=Math.PI/2; mwheel.position.set(0,0.041,-0.052); mouse.add(mwheel);   // small grey wheel, seated at the front
  { const gp=[]; for(let t=0;t<=1.001;t+=0.1){ const z=-0.055+t*0.06, nz=z/0.072, sy=0.037*Math.sqrt(Math.max(0,1-nz*nz)); gp.push(new THREE.Vector3(0,0.017+sy-0.0012,z)); }
    const groove=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(gp),24,0.0022,8), M(0x121419,0.6)); mouse.add(groove); }   // button-split groove on the curved top
  scene.add(mouse);
  const cablePts=[ new THREE.Vector3(1.32,deskTopY+0.046,-0.6), new THREE.Vector3(1.14,deskTopY+0.046,-0.6),   // plugs into the left SIDE of the laptop, exits horizontal
                   new THREE.Vector3(1.15,deskTopY+0.04,-0.73), new THREE.Vector3(1.45,deskTopY+0.032,-0.82),
                   new THREE.Vector3(1.85,deskTopY+0.035,-0.74), new THREE.Vector3(2.07,deskTopY+0.05,-0.56),
                   new THREE.Vector3(2.07,deskTopY+0.055,-0.45) ];
  const cable=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cablePts),60,0.004,8), M(0x222426,0.5)); scene.add(cable);

  // ===== black rolling desk chair (centered, you sit facing north) =====
  const chairX=1.55, chairZ=0.45, seatY=0.46;
  add(box(0.56,0.12,0.52,0x141414,0.5), chairX,seatY,chairZ);
  add(box(0.54,0.5,0.12,0x141414,0.5), chairX,seatY+0.34,chairZ+0.28);
  add(box(0.1,0.32,0.42,0x1c1c1c,0.5), chairX-0.33,seatY+0.05,chairZ);
  add(box(0.1,0.32,0.42,0x1c1c1c,0.5), chairX+0.33,seatY+0.05,chairZ);
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.34,12),M(0x2a2a2a,0.4)), chairX,0.28,chairZ);
  for(let k=0;k<5;k++){ const a=k/5*Math.PI*2;
    const leg=box(0.38,0.05,0.08,0x1c1c1c,0.4); leg.position.set(chairX+Math.cos(a)*0.19,0.11,chairZ+Math.sin(a)*0.19); leg.rotation.y=-a; scene.add(leg);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.07,10),M(0x0e0e0e,0.3)), chairX+Math.cos(a)*0.36,0.05,chairZ+Math.sin(a)*0.36); }

  // ===== tall BUREAU (west wall, upper) =====
  add(box(0.5,1.7,1.9,0x6f4a30), -1.75,0.85,-1.3);                                  // bureau (moved south)
  [0.34,0.68,1.02,1.36].forEach(y=> add(box(0.02,0.03,1.7,0x4f3322), -1.49,y,-1.3));   // 4 seams -> 5 sections
  [0.17,0.51,0.85,1.19,1.53].forEach(y=>{ add(new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),M(0x2c2925)), -1.49,y,-1.7); add(new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),M(0x2c2925)), -1.49,y,-0.9); });

  // ===== white DOOR (west wall, lower) — slab + frame aligned =====
  add(box(0.14,2.35,1.2,0xece7dd,0.6), -2.13,1.175,1.35);             // slab (south, near step wall)
  add(box(0.07,0.55,0.6,0xdcd5c8,0.6), -2.05,1.58,1.35);             // upper panel
  add(box(0.07,0.72,0.6,0xdcd5c8,0.6), -2.05,0.72,1.35);            // lower panel
  add(new THREE.Mesh(new THREE.SphereGeometry(0.05,10,10),M(0xc9a84a,0.25)), -2.03,1.15,0.9); // gold knob (right side)
  add(box(0.08,2.45,0.1,0xf6f3ec,0.6), -2.08,1.2,0.7);               // left jamb (flat casing)
  add(box(0.08,2.45,0.1,0xf6f3ec,0.6), -2.08,1.2,2.0);              // right jamb
  add(box(0.08,0.12,1.4,0xf6f3ec,0.6), -2.08,2.38,1.35);          // head (top, matches jambs)

  // ===== CLOSET: wide white sliding doors (two panels) on south wall =====
  const cz=SZ-0.1;
  add(box(2.5,2.3,0.04,0xe7e0d0,0.85), 1.2,1.15,cz);        // beige interior backing (shorter)
  add(box(1.3,2.34,0.04,0xf2efe8,0.6), 0.65,1.19,cz-0.03);  // left door (in front of wall)
  add(box(1.3,2.34,0.04,0xf6f3ec,0.6), 1.75,1.19,cz-0.05); // right door
  const fz=cz-0.055;                                        // thin white trim, at the door faces
  add(box(2.6,0.08,0.03,WHITE,0.6), 1.2,2.32,fz);         // top (thin, no bottom frame)
  add(box(0.08,2.32,0.03,WHITE,0.6), -0.06,1.16,fz);      // left
  add(box(0.08,2.32,0.03,WHITE,0.6), 2.46,1.16,fz);       // right

  // ===== WINDOW (big, 2 panes) on east wall: bed-foot -> before closet =====
  const wz0=-1.4, wz1=1.6, wzc=(wz0+wz1)/2, wlen=wz1-wz0, wyc=1.5, wht=1.5;
  const oc=document.createElement('canvas'); oc.width=320; oc.height=160; const ox=oc.getContext('2d');
  const og=ox.createLinearGradient(0,0,0,160); og.addColorStop(0,'#a9c4bd'); og.addColorStop(0.3,'#aecdab'); og.addColorStop(0.31,'#4f7e44'); og.addColorStop(1,'#2c5a28');
  ox.fillStyle=og; ox.fillRect(0,0,320,160);
  for(let i=0;i<110;i++){ ox.fillStyle='rgba('+(40+(Math.random()*50|0))+','+(120+(Math.random()*60|0))+','+(50+(Math.random()*40|0))+',.55)'; ox.beginPath(); ox.arc(Math.random()*320,50+Math.random()*110,8+Math.random()*22,0,7); ox.fill(); }
  const oTex=new THREE.CanvasTexture(oc);
  const winView=new THREE.Mesh(new THREE.PlaneGeometry(wlen,wht),
    new THREE.MeshStandardMaterial({ map:oTex, emissive:0xffffff, emissiveMap:oTex, emissiveIntensity:0.08 }));
  winView.position.set(RX-0.12,wyc,wzc); winView.rotation.y=-Math.PI/2; scene.add(winView);
  const FW=0xf2efe8;
  add(box(0.16,0.14,wlen+0.14,FW,0.6), RX-0.06,wyc-wht/2,wzc);   // sill
  add(box(0.16,0.12,wlen+0.14,FW,0.6), RX-0.06,wyc+wht/2,wzc);   // head
  add(box(0.16,wht+0.14,0.14,FW,0.6), RX-0.06,wyc,wz0);          // left end (meets sill+head)
  add(box(0.16,wht+0.14,0.14,FW,0.6), RX-0.06,wyc,wz1);          // right end
  add(box(0.16,wht+0.14,0.16,FW,0.6), RX-0.06,wyc,wzc);         // mullion
  const pc=document.createElement('canvas'); pc.width=128; pc.height=256; const px=pc.getContext('2d');
  px.fillStyle='#bcb088'; px.fillRect(0,0,128,256); px.globalAlpha=0.55;      // beige base (less white)
  px.fillStyle='#97a487'; for(let i=6;i<128;i+=34){ px.fillRect(i,0,9,256);} for(let j=6;j<256;j+=34){ px.fillRect(0,j,128,9);}   // faded sage green
  px.fillStyle='#5c79a0'; for(let i=20;i<128;i+=34){ px.fillRect(i,0,7,256);} for(let j=20;j<256;j+=34){ px.fillRect(0,j,128,7);} px.globalAlpha=1; // darker blue
  const plaid=new THREE.CanvasTexture(pc), curtMat=new THREE.MeshStandardMaterial({map:plaid,roughness:0.9});
  [0,1,2].forEach(i=>{ const z=wz0+wlen*(i+0.5)/3; const cu=new THREE.Mesh(new THREE.PlaneGeometry(0.85,wht+0.2),curtMat); cu.position.set(RX-0.18,wyc,z); cu.rotation.y=-Math.PI/2; scene.add(cu); });   // 3 evenly spaced, equal size
  const crod=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,wlen+0.2,12),M(0x35373b,0.4)); crod.rotation.x=Math.PI/2; crod.position.set(RX-0.22,wyc+wht/2+0.13,wzc); scene.add(crod);  // curtain rod
  [wz0-0.1,wz1+0.1].forEach(z=> add(new THREE.Mesh(new THREE.SphereGeometry(0.045,12,12),M(0x35373b,0.4)), RX-0.22,wyc+wht/2+0.13,z)); // finials

  // ===== ceiling fan (middle of room) =====
  const fan=new THREE.Group(); fan.position.set(0.3,RH-0.16,-1.0); scene.add(fan);
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.32,8),M(0x3a352c)); rod.position.y=0.16; fan.add(rod);
  fan.add(new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.1,16),M(0x4a4540)));
  const fanBlades=new THREE.Group(); fan.add(fanBlades);
  for(let b=0;b<5;b++){ const h=new THREE.Group(); h.rotation.y=b/5*Math.PI*2;
    const bl=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.035,0.14),M(0x1c1c1c,0.5)); bl.position.x=0.38; h.add(bl);
    fanBlades.add(h); }
  const globe=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,16), new THREE.MeshStandardMaterial({color:0xeae6da,emissive:0xccd4de,emissiveIntensity:0.12})); globe.position.y=-0.04; fan.add(globe);

  // ===== lighting (cool / blue) =====
  scene.add(new THREE.HemisphereLight(0xe6ebf0, 0x8a8c82, 0.72));   // lighter ground -> evenly lit ceiling
  const ceilLamp=new THREE.PointLight(0xe2ecff, 2.6, 26, 2); ceilLamp.position.set(0.3,RH-0.8,-1.0); scene.add(ceilLamp);
  const day=new THREE.PointLight(0xdbe6ff, 1.2, 11, 2); day.position.set(2.2,1.9,wzc); scene.add(day);
  const tvGlow=new THREE.PointLight(0x6fb1ff, 0, 5, 2); tvGlow.position.set(1.55,0.95,-0.4); scene.add(tvGlow);

  // ===== game discs on the desk (clickable) =====
  const SLOT_WORLD=new THREE.Vector3(1.33,deskTopY+0.045,-0.5);   // into the laptop's left side
  const carts=[];
  PROJECTS.forEach((p,i)=>{
    const g=new THREE.Group();
    const col=new THREE.Color(p.color).getHex();
    const dc=document.createElement('canvas'); dc.width=128; dc.height=128; const dctx=dc.getContext('2d');
    dctx.fillStyle='#'+col.toString(16).padStart(6,'0'); dctx.beginPath(); dctx.arc(64,64,63,0,7); dctx.fill();
    dctx.strokeStyle='rgba(255,255,255,.22)'; dctx.lineWidth=3; dctx.beginPath(); dctx.arc(64,64,46,0,7); dctx.stroke();
    dctx.fillStyle='#dfe3e6'; dctx.beginPath(); dctx.arc(64,64,17,0,7); dctx.fill();
    dctx.fillStyle='#10131a'; dctx.beginPath(); dctx.arc(64,64,7,0,7); dctx.fill();
    dctx.fillStyle='#fff'; dctx.font='11px Bungee'; dctx.textAlign='center'; dctx.fillText(p.name,64,42);
    const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.008,40),
      new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(dc),roughness:0.25,metalness:0.35}));
    g.add(disc);                                                                   // lying flat on the desk
    const j=PROJECTS.length-1-i; const home=new THREE.Vector3(0.7+j*0.16,0.68+j*0.006,-0.35-j*0.05);   // swapped disc order
    g.position.copy(home); g.rotation.y=0;
    scene.add(g);
    carts.push({ proj:p, grp:g, home, state:'home', t:0 });
  });
  function wrap(ctx,text,x,y,maxw,lh){ const words=text.split(' '); let line='',yy=y;
    for(const w of words){ const test=line+w+' '; if(ctx.measureText(test).width>maxw && line){ ctx.fillText(line,x,yy); line=w+' '; yy+=lh; } else line=test; } ctx.fillText(line,x,yy); }

  // ===== screen / panel =====
  let loaded=null;
  function drawScreen(){
    if(!loaded){ sctx.fillStyle='#0a0c08'; sctx.fillRect(0,0,512,384);
      sctx.fillStyle='#1c2018'; for(let i=0;i<384;i+=3){ sctx.globalAlpha=Math.random()*0.5; sctx.fillRect(0,i,512,1);} sctx.globalAlpha=1;
      sctx.fillStyle='rgba(239,233,218,.25)'; sctx.font='20px "Space Mono",monospace'; sctx.textAlign='center';
      sctx.fillText('insert a disc',256,196); screenTex.needsUpdate=true; return; }
    const p=loaded.proj; sctx.fillStyle=p.color; sctx.fillRect(0,0,512,384);
    sctx.fillStyle='rgba(0,0,0,.18)'; sctx.fillRect(36,40,440,230);
    sctx.fillStyle='#fff'; sctx.font='40px Bungee'; sctx.textAlign='center'; sctx.fillText(p.name,256,165);
    sctx.font='20px "Space Mono",monospace'; sctx.fillStyle='rgba(255,255,255,.9)'; sctx.fillText(p.tag,256,205);
    if(p.live){ sctx.strokeStyle='#fff'; sctx.lineWidth=4; sctx.beginPath(); sctx.arc(256,320,30,0,7); sctx.stroke();
      sctx.fillStyle='#fff'; sctx.beginPath(); sctx.moveTo(248,304); sctx.lineTo(248,336); sctx.lineTo(276,320); sctx.closePath(); sctx.fill(); }   // play icon
    // no play button for coming-soon discs
    for(let i=0;i<384;i+=3){ sctx.globalAlpha=0.09; sctx.fillStyle='#000'; sctx.fillRect(0,i,512,1);} sctx.globalAlpha=1;
    screenTex.needsUpdate=true;
  }
  drawScreen();
  function syncPanel(){}   // the laptop screen itself is the UI now (no HTML panel)
  function insert(cart){
    if(cart.state==='in'||cart.state==='inserting'){ cart.state='ejecting'; cart.t=0; loaded=null; tvGlow.intensity=0; drawScreen(); syncPanel(); return; }
    carts.forEach(c=>{ if(c!==cart && (c.state==='in'||c.state==='inserting')){ c.state='ejecting'; c.t=0; } });
    cart.state='inserting'; cart.t=0; document.getElementById('hint').style.opacity=0;
  }

  // ===== seated camera: look only, no walking =====
  let yaw=0, pitch=-0.25;
  const eye=new THREE.Vector3(chairX,1.3,chairZ);
  let introT=0; const INTRO=1.0, iy0=-0.9, ip0=0.26; yaw=iy0; pitch=ip0;   // 1s intro pan to the laptop
  let dragging=false, moved=false, last={x:0,y:0};
  renderer.domElement.addEventListener('pointerdown',e=>{ dragging=true; moved=false; last={x:e.clientX,y:e.clientY}; document.body.classList.add('dragging'); });
  addEventListener('pointermove',e=>{ if(dragging){ const dx=e.clientX-last.x,dy=e.clientY-last.y; last={x:e.clientX,y:e.clientY};
      if(Math.hypot(dx,dy)>2) moved=true; yaw+=dx*0.005; pitch=Math.max(-1.1,Math.min(0.8,pitch+dy*0.005)); } else hover(e); });
  addEventListener('pointerup',e=>{ document.body.classList.remove('dragging'); if(dragging&&!moved) clickAt(e); dragging=false; });
  renderer.domElement.addEventListener('wheel',e=>{ camera.fov=Math.max(38,Math.min(78,camera.fov+e.deltaY*0.03)); camera.updateProjectionMatrix(); },{passive:true});

  const ray=new THREE.Raycaster(), m=new THREE.Vector2(), tipEl=document.getElementById('tip');
  function pickCart(e){ m.x=(e.clientX/innerWidth)*2-1; m.y=-(e.clientY/innerHeight)*2+1; ray.setFromCamera(m,camera);
    const hits=ray.intersectObjects(carts.map(c=>c.grp),true); if(!hits.length) return null; let o=hits[0].object;
    return carts.find(c=>c.grp===o||c.grp===o.parent); }
  function clickAt(e){ const c=pickCart(e); if(c){ insert(c); return; }
    if(loaded && loaded.proj.live && ray.intersectObject(screen,true).length) location.href=loaded.proj.url; }   // click the screen to play
  function hover(e){ const c=pickCart(e); if(c){ renderer.domElement.style.cursor='pointer'; }
    else { tipEl.style.opacity=0;
      renderer.domElement.style.cursor=(loaded && loaded.proj.live && ray.intersectObject(screen,true).length) ? 'pointer' : ''; } }

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  let lastT=performance.now();
  function loop(now){ const dt=Math.min((now-lastT)/1000,0.05); lastT=now;
    if(introT<INTRO){ introT=Math.min(INTRO,introT+dt); const e=ease(introT/INTRO); yaw=iy0*(1-e); pitch=ip0+(-0.25-ip0)*e; }
    camera.rotation.set(pitch,yaw,0); camera.position.copy(eye);
    carts.forEach(c=>{
      if(c.state==='inserting'){ c.t=Math.min(1,c.t+dt*2.2); c.grp.position.lerpVectors(c.home,SLOT_WORLD,ease(c.t));
        if(c.t>=1){ c.state='in'; loaded=c; tvGlow.color.set(c.proj.color); tvGlow.intensity=2; drawScreen(); syncPanel(); } }
      else if(c.state==='ejecting'){ c.t=Math.min(1,c.t+dt*2.4); c.grp.position.lerpVectors(SLOT_WORLD,c.home,ease(c.t));
        if(c.t>=1){ c.state='home'; c.grp.position.copy(c.home); } }
    });
    fanBlades.rotation.y += dt*2.2;
    renderer.render(scene,camera); requestAnimationFrame(loop);
  }
  function ease(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
  requestAnimationFrame(loop);
</script>
</body>
</html>
